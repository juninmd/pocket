name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Install dependencies
      run: cd firefox-pocket-extension && pnpm install

    - name: Run tests
      run: cd firefox-pocket-extension && pnpm test

    - name: Build production
      run: cd firefox-pocket-extension && pnpm run build:prod
