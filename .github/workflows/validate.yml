name: Validate

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firefox-pocket-extension
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: firefox-pocket-extension/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: firefox-pocket-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec jest --ci
      - run: pnpm run build:prod
